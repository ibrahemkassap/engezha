<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0D1117"/>
  <!-- Centered Mobile Mockup -->
  <rect x="270" y="25" width="260" height="450" rx="36" fill="#161B22" stroke="#30363D" stroke-width="4"/>
  <!-- Phone Notch/Dynamic Island -->
  <rect x="360" y="38" width="80" height="18" rx="9" fill="#0D1117"/>
  <!-- Screen content -->
  <rect x="285" y="70" width="230" height="40" rx="8" fill="#1F2937"/>
  <circle cx="310" cy="90" r="14" fill="#10B981"/>
  <rect x="335" y="85" width="90" height="10" rx="2" fill="#F3F4F6"/>
  
  <rect x="285" y="125" width="230" height="130" rx="12" fill="#1F2937"/>
  <text x="400" y="165" font-family="sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">تمرين اليوم: هيت كارديو</text>
  <rect x="330" y="185" width="140" height="30" rx="15" fill="#10B981"/>
  <text x="400" y="205" font-family="sans-serif" font-size="12" fill="#0D1117" text-anchor="middle" font-weight="bold">ابدأ التمرين (25 دقيقة)</text>

  <!-- Stats Grid -->
  <rect x="285" y="270" width="110" height="90" rx="10" fill="#1F2937"/>
  <text x="340" y="305" font-family="sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">السعرات</text>
  <text x="340" y="335" font-family="sans-serif" font-size="18" fill="#F59E0B" text-anchor="middle" font-weight="bold">520 kcal</text>

  <rect x="405" y="270" width="110" height="90" rx="10" fill="#1F2937"/>
  <text x="460" y="305" font-family="sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">الماء</text>
  <text x="460" y="335" font-family="sans-serif" font-size="18" fill="#38BDF8" text-anchor="middle" font-weight="bold">2.4 L</text>

  <!-- Bottom Nav -->
  <rect x="285" y="415" width="230" height="40" rx="8" fill="#0D1117"/>
  <circle cx="320" cy="435" r="6" fill="#10B981"/>
  <circle cx="360" cy="435" r="6" fill="#6B7280"/>
  <circle cx="400" cy="435" r="6" fill="#6B7280"/>
  <circle cx="440" cy="435" r="6" fill="#6B7280"/>
  <circle cx="480" cy="435" r="6" fill="#6B7280"/>
</svg>
