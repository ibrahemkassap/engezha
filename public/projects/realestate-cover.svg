<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="reGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#reGrad)"/>
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="2"/>
  
  <!-- Architectural Hero Frame -->
  <rect x="80" y="70" width="640" height="200" rx="10" fill="#1E293B"/>
  <text x="120" y="140" font-family="sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold">واحات النخيل السكنية الفاخرة</text>
  <text x="120" y="175" font-family="sans-serif" font-size="14" fill="#94A3B8">فلل بتصميم معماري معاصر وتشطيبات راقية بمقدم يبدأ من 10%</text>
  <rect x="120" y="200" width="140" height="38" rx="6" fill="#F5A623"/>
  <text x="190" y="224" font-family="sans-serif" font-size="13" fill="#101828" text-anchor="middle" font-weight="bold">طلب جولة افتراضية</text>

  <!-- Filter Bar -->
  <rect x="80" y="290" width="640" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="100" y="305" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="250" y="305" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="400" y="305" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="560" y="305" width="140" height="30" rx="6" fill="#4F46E5"/>
  <text x="630" y="325" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">بحث وتصفية</text>

  <!-- Units Mini grid -->
  <rect x="80" y="370" width="200" height="60" rx="6" fill="#F1F5F9"/>
  <rect x="300" y="370" width="200" height="60" rx="6" fill="#F1F5F9"/>
  <rect x="520" y="370" width="200" height="60" rx="6" fill="#F1F5F9"/>
</svg>
